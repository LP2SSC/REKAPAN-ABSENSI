function toInputDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function dateOffsetStr(d, offsetDays) { return toInputDate(new Date(d.getFullYear(), d.getMonth(), d.getDate() + offsetDays)); }
function eachDateStr(startStr, endStr) {
  const out = [];
  const [ys, ms, ds] = startStr.split("-").map(Number);
  const [ye, me, de] = endStr.split("-").map(Number);
  let cur = new Date(ys, ms-1, ds);
  const end = new Date(ye, me-1, de);
  while (cur <= end) { out.push(toInputDate(cur)); cur.setDate(cur.getDate() + 1); }
  return out;
}
function weekRangesInMonth(year, month) {
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const ranges = [];
  const bounds = [[1,7],[8,14],[15,21],[22,daysInMonth]];
  bounds.forEach((b, idx) => {
    if (b[0] > daysInMonth) return;
    const end = Math.min(b[1], daysInMonth);
    const s = `${year}-${String(month+1).padStart(2,"0")}-${String(b[0]).padStart(2,"0")}`;
    const e = `${year}-${String(month+1).padStart(2,"0")}-${String(end).padStart(2,"0")}`;
    ranges.push({ week: idx + 1, start: s, end: e });
  });
  return ranges;
}
async function copyText(text) {
  try { if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(text); return true; } } catch {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand("copy"); document.body.removeChild(ta); return ok;
  } catch { return false; }
}
function toFbKey(name) {

}

function makeDefaultProgramConfig() { return { programs: [ { id:"P1", label:"Program 1", subs:[] } ] }; }
function normalizeProgramDays(raw) {
  if (Array.isArray(raw) && raw.length) {
    const set = new Set();
    raw.forEach(v => { const n = Number(v); if (!isNaN(n) && n >= 0 && n <= 6) set.add(n); });
    if (set.size) return Array.from(set).sort((a,b) => (a===0?7:a) - (b===0?7:b));
  }
  if (raw != null && typeof raw !== "object") {
    const n = Number(raw);
    if (!isNaN(n) && n >= 0 && n <= 6) return [n];
  }
  return [...ALL_DAYS];
}
function normalizeSubs(rawSubs) {
  let arr = [];
  if (Array.isArray(rawSubs)) arr = rawSubs;
  else if (rawSubs && typeof rawSubs === "object") {
    arr = Object.keys(rawSubs).sort((a,b) => parseInt(a,10) - parseInt(b,10)).map(k => rawSubs[k]);
  }
  return arr.filter(s => s && typeof s === "object")
    .map(s => ({
      id: String(s.id || ""),
      label: String(s.label || ("Sub " + s.id)).trim() || ("Sub " + s.id),
      emoji: Array.from(String(s.emoji || "")).slice(0, 4).join(""),
      days: normalizeProgramDays(s.days)
    }))
    .filter(s => s.id);
}
function normalizeProgramConfig(raw) {
  if (!raw || typeof raw !== "object") return makeDefaultProgramConfig();
  let rawPrograms = null;
  if (Array.isArray(raw.programs)) rawPrograms = raw.programs;
  else if (raw.programs && typeof raw.programs === "object") {
    rawPrograms = Object.keys(raw.programs).sort((a,b) => parseInt(a,10) - parseInt(b,10)).map(k => raw.programs[k]);
  }
  if (rawPrograms) {
    return { programs: rawPrograms.filter(p => p && typeof p === "object")
      .map(p => ({ id: String(p.id || ""), label: String(p.label || "").trim() || ("Program " + String(p.id || "1")), subs: normalizeSubs(p.subs) }))
      .filter(p => p.id) };
  }
  const legacyKeys = Object.keys(raw).filter(k => raw[k] && typeof raw[k] === "object" && raw[k].subs !== undefined);
  if (legacyKeys.length) {
    return { programs: legacyKeys.sort().map(k => ({ id: k, label: String(raw[k].label || "").trim() || ("Program " + k.slice(1)), subs: normalizeSubs(raw[k].subs) })) };
  }
  return makeDefaultProgramConfig();
}
function makeBatchKey(pId, sId) { return pId + "_" + sId; }
function programOfBatch(k) { return String(k).split("_")[0]; }
function subOfBatch(k) { return String(k).split("_").slice(1).join("_") || "_none"; }
function getProgramLabel(config, pId) {
  const p = (config.programs || []).find(x => x.id === pId);
  return p ? p.label : pId;
}
function getSubLabel(config, pId, sId) {
  const p = (config.programs || []).find(x => x.id === pId);
  if (!p) return String(sId);
  const s = (p.subs || []).find(x => String(x.id) === String(sId));
  return s ? s.label : String(sId);
}
function getProgramTheme(config, pId) {
  const idx = (config.programs || []).findIndex(p => p.id === pId);
  if (idx < 0) return TPL_THEME_PALETTE[0];
  return TPL_THEME_PALETTE[idx % TPL_THEME_PALETTE.length];
}
function getAllBatchEntries(config) {
  const out = [];
  (config.programs || []).forEach(p => {
    const subs = p.subs || [];
    if (!subs.length) {
      out.push({ key: makeBatchKey(p.id, "_none"), label: p.label || p.id, program: p.id, sub: "_none" });
    } else {
      subs.forEach(s => out.push({ key: makeBatchKey(p.id, s.id), label: (p.label || p.id) + " · " + (s.label || s.id), program: p.id, sub: s.id }));
    }
  });
  return out;
}

    if (!Array.isArray(names) || !names.length) names = [];
    names = names.map(n => String(n).trim()).filter(Boolean).sort((a,c) => a.localeCompare(c, "id"));
    const matrix = {};
    names.forEach(n => { matrix[n] = {}; });
    await Promise.all(dateList.map(ds =>
      db.ref(tplAttendancePath(roomCode, k, ds)).once("value").then(snap => {
        const val = snap.val() || {};
        names.forEach(n => {
          let st = null;
          const item = val[toFbKey(n)] !== undefined ? val[toFbKey(n)] : val[n];
          if (item && typeof item === "object") st = normalizeStatus(item.status);
          else if (typeof item === "string") st = normalizeStatus(item);
          matrix[n][ds] = st;
        });
      }).catch(() => { names.forEach(n => { matrix[n][ds] = matrix[n][ds] || null; }); })

        cell.alignment = { horizontal: "center", vertical: "middle" }; cell.border = thinBorder;

      headerRow.height = 22;

      allRows.forEach((r, idx) => {

        const c2 = row.getCell(2); c2.value = r.program; c2.font = normalFont; c2.alignment = {horizontal:"center",vertical:"middle"}; c2.border = thinBorder;

        [r.h, r.i, r.s, r.a].forEach((val, tIdx) => {
          const cell = row.getCell(4 + dayCount + tIdx);
          cell.value = val; cell.font = normalFont; cell.alignment = {horizontal:"center",vertical:"middle"}; cell.border = thinBorder;
          if (val > 0) cell.fill = [fillH, fillI, fillS, fillA][tIdx];

      for (let i = 4; i < 4 + dayCount; i++) ws.getColumn(i).width = 3.5;

/* =====================================================================
   ============ SUBUH DASHBOARD ========================================
   ===================================================================== */
function SubuhDashboard({ onExit }) {
  const [dashMonth, setDashMonth] = useState(() => new Date().getMonth());
  const [dashYear, setDashYear] = useState(() => new Date().getFullYear());
  const [dashWholeMonth, setDashWholeMonth] = useState(true);
  const [dashWeeks, setDashWeeks] = useState([1,2,3,4]);
  const [dashBatch, setDashBatch] = useState("1");
  const [dashboardData, setDashboardData] = useState(null);
  const [dashboardLoading, setDashboardLoading] = useState(false);
  const [exportBusy, setExportBusy] = useState(false);

  const [showSalinRekap, setShowSalinRekap] = useState(false);
  const [salinRekapRange, setSalinRekapRange] = useState("1w");
  const [salinRekapStart, setSalinRekapStart] = useState(() => dateOffsetStr(new Date(), -6));
  const [salinRekapEnd, setSalinRekapEnd] = useState(() => toInputDate(new Date()));
  const [salinRekapSelected, setSalinRekapSelected] = useState({});
  const [salinRekapBusy, setSalinRekapBusy] = useState(false);
  const [salinRekapMonth, setSalinRekapMonth] = useState(() => new Date().getMonth());
  const [salinRekapYear, setSalinRekapYear] = useState(() => new Date().getFullYear());

  const [previewText, setPreviewText] = useState("");
  const [previewLabel, setPreviewLabel] = useState("");
  const [showPreview, setShowPreview] = useState(false);
  const taRef = useRef(null);

  const [toastMsg, setToastMsg] = useState("");
  const [toastVisible, setToastVisible] = useState(false);
  const toast = (msg) => { setToastMsg(msg); setToastVisible(true); setTimeout(() => setToastVisible(false), 2800); };

  const getDateList = () => {
    const daysInMonth = new Date(dashYear, dashMonth + 1, 0).getDate();
    if (dashWholeMonth) {
      const s = `${dashYear}-${String(dashMonth+1).padStart(2,"0")}-01`;
      const e = `${dashYear}-${String(dashMonth+1).padStart(2,"0")}-${String(daysInMonth).padStart(2,"0")}`;
      return eachDateStr(s, e);
    }
    const ranges = weekRangesInMonth(dashYear, dashMonth).filter(r => dashWeeks.includes(r.week));
    const list = [];
    ranges.forEach(r => eachDateStr(r.start, r.end).forEach(d => list.push(d)));
    return [...new Set(list)].sort();
  };

  const getStudentsForBatch = async (b) => {
    try {
      const snap = await db.ref(subuhStudentsPath(b)).once("value");
      const val = snap.val();
      if (Array.isArray(val) && val.length) {
        return val.map(n => String(n).trim()).filter(Boolean).sort((a,c) => a.localeCompare(c, "id"));
      }
    } catch {}
    return (SUBUH_BATCH_STUDENTS[b] || []).map(n => String(n).trim()).filter(Boolean).sort((a,c) => a.localeCompare(c, "id"));
  };

  const buildMatrixForBatch = async (b, dateList) => {
    const names = await getStudentsForBatch(b);
    const matrix = {};
    names.forEach(n => { matrix[n] = {}; });
    await Promise.all(dateList.map(ds =>
      db.ref(subuhAttendancePath(b, ds)).once("value").then(snap => {
        const val = snap.val() || {};
        names.forEach(n => {
          let st = null;
          const item = val[toFbKey(n)] !== undefined ? val[toFbKey(n)] : val[n];
          if (item && typeof item === "object") st = normalizeStatus(item.status);
          else if (typeof item === "string") st = normalizeStatus(item);
          matrix[n][ds] = st;
        });
      }).catch(() => { names.forEach(n => { matrix[n][ds] = matrix[n][ds] || null; }); })
    ));
    const totals = {};
    names.forEach(n => {
      const t = { HADIR:0, IZIN:0, SAKIT:0, ALFA:0 };
      dateList.forEach(ds => { const st = matrix[n][ds]; if (st && t[st] !== undefined) t[st]++; });
      totals[n] = t;
    });
    return { names, matrix, totals };
  };

  const sheetNameFor = (b) => {
    const th = SUBUH_BATCH_THEME[b];
    let n = (th && th.label) ? th.label : ("Batch " + b);
    return String(n).replace(/[\\\/\?\*\[\]]/g, " ").slice(0, 31);
  };

  const openDashboard = async () => {
    setDashboardLoading(true); setDashboardData(null);
    try {
      const dateList = getDateList();
      if (!dateList.length) { setDashboardData({ error: "Tidak ada tanggal" }); setDashboardLoading(false); return; }
      const { names, matrix, totals } = await buildMatrixForBatch(dashBatch, dateList);
      const th = SUBUH_BATCH_THEME[dashBatch] || {};
      setDashboardData({ start: dateList[0], end: dateList[dateList.length-1], dates: dateList, matrix, totals, names, batchKey: dashBatch, batchLabel: th.label || dashBatch, days: dateList.length });
    } catch { setDashboardData({ error: "Gagal load data" }); }
    setDashboardLoading(false);
  };

  const buildRekapTextFor = async (b, dateList) => {
    const names = await getStudentsForBatch(b);
    if (!names.length) return null;
    const th = SUBUH_BATCH_THEME[b] || {};
    const label = th.label || b;

              h("div", { style:{ flex:1 } }, [
                h("div", { style:{ fontSize:13, fontWeight:800, color:"#0f172a" } }, opt.label),
                h("div", { style:{ fontSize:11, fontWeight:600, color:"#94a3b8" } }, opt.desc)

        ),
        salinRekapRange === "1m" && h("div", { style:{ display:"flex", gap:8, marginBottom:12 } }, [

          h("select", {
            value: salinRekapYear, onChange: e => setSalinRekapYear(Number(e.target.value)),

          }, (() => { const now = new Date().getFullYear(); const o = []; for (let y = now; y >= now-2; y--) o.push(h("option", { key:y, value:y }, y)); return o; })())
        ]),
        salinRekapRange === "custom" && h("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:12 } }, [
          h("div", null, [
            h("div", { style:{ fontSize:11, fontWeight:700, color:"#94a3b8", marginBottom:4 } }, "DARI TANGGAL"),
            h("input", { type:"date", value: salinRekapStart, onChange: e => setSalinRekapStart(e.target.value), style:{ width:"100%", height:40, padding:"0 10px", borderRadius:10, border:"1px solid #cbd5e1", fontSize:13, fontWeight:600 } })
          ]),
          h("div", null, [
            h("div", { style:{ fontSize:11, fontWeight:700, color:"#94a3b8", marginBottom:4 } }, "SAMPAI TANGGAL"),
            h("input", { type:"date", value: salinRekapEnd, onChange: e => setSalinRekapEnd(e.target.value), style:{ width:"100%", height:40, padding:"0 10px", borderRadius:10, border:"1px solid #cbd5e1", fontSize:13, fontWeight:600 } })
          ])
        ]),
        h("div", { style:{ border:"1px solid #e2e8f0", borderRadius:14, padding:12, marginBottom:16, background:"#fafbff" } }, [
          h("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8, flexWrap:"wrap", gap:6 } }, [
            h("div", { style:{ fontSize:11, fontWeight:800, color:"#64748b", letterSpacing:"0.06em" } }, "PILIH BATCH"),
            h("div", { style:{ display:"flex", gap:6 } }, [
              h("button", {
                onClick: () => { const all = {}; SUBUH_BATCH_LIST.forEach(b => { all[b] = true; }); setSalinRekapSelected(all); },
                style:{ height:28, padding:"0 12px", borderRadius:8, border:"1px solid #cbd5e1", background:"#fff", fontSize:11, fontWeight:700, cursor:"pointer", color:"#0f172a" }
              }, "✓ Semua"),
              h("button", {
                onClick: () => setSalinRekapSelected({}),
                style:{ height:28, padding:"0 12px", borderRadius:8, border:"1px solid #cbd5e1", background:"#fff", fontSize:11, fontWeight:700, cursor:"pointer", color:"#64748b" }
              }, "Kosongkan")
            ])
          ]),
          h("div", { style:{ maxHeight:220, overflowY:"auto", display:"flex", flexDirection:"column", gap:4 } },
            ...SUBUH_BATCH_LIST.map(b => {
              const checked = !!salinRekapSelected[b];
              const th = SUBUH_BATCH_THEME[b] || {};
              const short = b === "MM" ? "MM" : b === "MS" ? "MS" : b === "TR" ? "TR" : b === "A18" ? "A18" : ("B" + b);
              return h("label", {
                key: b,
                style:{ display:"flex", alignItems:"center", gap:8, padding:"8px 10px", borderRadius:10, cursor:"pointer",
                  background: checked ? "#eff6ff" : "#fff",
                  border: checked ? "1.5px solid #93c5fd" : "1px solid #e2e8f0" }
              }, [
                h("input", { type:"checkbox", checked, onChange: () => setSalinRekapSelected(prev => ({ ...prev, [b]: !prev[b] })), style:{ width:18, height:18, accentColor: th.accent || "#3b82f6" } }),
                h("span", { style:{ padding:"2px 8px", borderRadius:999, fontSize:10, fontWeight:900, background: th.accentLight || "#e2e8f0", color: th.accentDark || "#475569", flexShrink:0 } }, short),
                h("span", { style:{ fontSize:12, fontWeight:700, color:"#1e293b", flex:1, minWidth:0, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" } }, th.label || b)
              ]);
            })
          ),
          h("div", { style:{ fontSize:11, fontWeight:800, color:"#1e40af", marginTop:10, paddingTop:8, borderTop:"1px solid #e2e8f0" } },
            Object.keys(salinRekapSelected).filter(k => salinRekapSelected[k]).length + " dari " + SUBUH_BATCH_LIST.length + " batch terpilih")
        ]),
        h("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 } }, [
          h("button", { onClick: () => setShowSalinRekap(false), disabled: salinRekapBusy, style:{ borderRadius:999, background:"#f4f4f5", border:"1px solid #e4e4e7", padding:"12px 16px", fontSize:13, fontWeight:700, color:"#3f3f46", cursor: salinRekapBusy ? "wait" : "pointer", opacity: salinRekapBusy ? 0.6 : 1 } }, "Batal"),
          h("button", { onClick: doSalinRekap, disabled: salinRekapBusy, style:{ borderRadius:999, background:"#25D366", border:"none", color:"#fff", padding:"12px 16px", fontSize:13, fontWeight:800, cursor: salinRekapBusy ? "wait" : "pointer", opacity: salinRekapBusy ? 0.6 : 1 } }, salinRekapBusy ? "Menyusun…" : "📋 Salin")
        ])
      ])
    ]),

    showPreview && h("div", { style:{ position:"fixed", inset:0, zIndex:250, display:"flex", alignItems:"flex-end", justifyContent:"center" } }, [
      h("div", { onClick: () => setShowPreview(false), style:{ position:"absolute", inset:0, background:"rgba(0,0,0,.4)", backdropFilter:"blur(6px)" } }),
      h("div", { style:{ position:"relative", width:"100%", maxWidth:520, background:"#fff", borderRadius:"28px 28px 0 0", boxShadow:"0 20px 80px rgba(0,0,0,.25)", maxHeight:"85vh", display:"flex", flexDirection:"column", overflow:"hidden", animation:"slideUp .3s ease" } }, [
        h("div", { style:{ padding:"20px 24px", borderBottom:"1px solid #eee", display:"flex", justifyContent:"space-between", alignItems:"center" } }, [
          h("div", null, [
            h("div", { style:{ fontWeight:800, fontSize:15 } }, "Preview — " + previewLabel),
            h("div", { style:{ fontSize:12, color:"#94a3b8", fontWeight:600 } }, "Tersalin otomatis • atau Kirim ke WA")
          ]),
          h("button", { onClick: () => setShowPreview(false), style:{ width:36, height:36, borderRadius:999, background:"rgba(0,0,0,.06)", border:"none", cursor:"pointer", fontSize:16 } }, "✕")
        ]),
        h("div", { style:{ padding:16, overflow:"auto", flex:1 } }, [
          h("textarea", { ref: taRef, readOnly: true, value: previewText, onFocus: e => e.target.select(), onClick: e => e.target.select(), style:{ width:"100%", height:280, resize:"none", borderRadius:12, border:"1px solid #e4e4e7", background:"#fafafa", padding:16, fontSize:13, lineHeight:1.6, fontFamily:"monospace", outline:"none" } })
        ]),
        h("div", { style:{ padding:16, borderTop:"1px solid #eee", background:"#fcfcfc", display:"flex", gap:12 } }, [
          h("button", { onClick: () => setShowPreview(false), style:{ flex:1, height:48, borderRadius:12, background:"#fff", border:"1px solid #e4e4e7", fontWeight:700, fontSize:13, cursor:"pointer" } }, "Tutup"),
          h("button", { onClick: () => { window.open(`https://wa.me/6285896639315?text=${encodeURIComponent(previewText)}`, "_blank"); }, style:{ flex:1, height:48, borderRadius:12, border:"none", background:"#25D366", color:"#fff", fontWeight:700, fontSize:13, cursor:"pointer", boxShadow:"0 4px 12px rgba(37,211,102,.35)" } }, "📤 Kirim ke WA")
        ])
      ])
    ]),

    h(Toast, { msg: toastMsg, visible: toastVisible })
  ]);
}

/* =====================================================================
   ============ LANDING / SELECTION SCREEN =============================
   ===================================================================== */

  const cards = [
    {
      id: "template",
      icon: "📚",
      bg: "#7c3aed",
      title: "Template Absensi",
      subtitle: "Multi-Kelas · Per Room",
      desc: "Dashboard untuk kelas template. Butuh kode kelas untuk masuk (sistem room per kelas).",
      tag: "🔑 Butuh kode kelas"
    },
    {
      id: "subuh",
      icon: "🕌",
      bg: "#16a34a",
      title: "Absensi Subuh LN",
      subtitle: "Program Luar Negeri",
      desc: "Absensi shalat subuh semua batch program luar negeri. Langsung masuk tanpa kode.",
      tag: "✓ Langsung masuk"
    }
  ];

  return h("div", {
    style: { minHeight:"100vh", background:"linear-gradient(135deg, #f0f9ff 0%, #c7d2fe 100%)", display:"flex", alignItems:"center", justifyContent:"center", padding:20 }
  }, [
    h("div", { style:{ width:"100%", maxWidth:800 } }, [
      h("div", { style:{ textAlign:"center", marginBottom:36 } }, [
        h("div", { style:{ width:72, height:72, borderRadius:22, background:"#0f172a", color:"#fff", display:"flex", alignItems:"center", justifyContent:"center", fontWeight:900, fontSize:32, margin:"0 auto 16px" } }, "📊"),
        h("div", { style:{ fontSize:28, fontWeight:900, letterSpacing:"-0.03em", color:"#0f172a" } }, "Dashboard Rekap"),
        h("div", { style:{ fontSize:13, fontWeight:600, color:"#64748b", marginTop:8, letterSpacing:"0.08em" } }, "LP2SSC · PANEL ADMIN · REKAP & EXCEL")
      ]),
      h("div", { style:{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(320px,1fr))", gap:16 } },
        cards.map(card =>
          h("button", {
            key: card.id,
            onClick: () => onSelect(card.id),
            style: {
              background:"#fff", borderRadius:24, padding:28, border:"1px solid #e2e8f0",
              boxShadow:"0 12px 40px -12px rgba(0,0,0,.15)", cursor:"pointer",
              textAlign:"left", display:"flex", flexDirection:"column", gap:14,
              transition:"all .2s", animation:"scaleIn .3s ease"
            },
            onMouseEnter: e => { e.currentTarget.style.transform = "translateY(-4px)"; e.currentTarget.style.boxShadow = "0 20px 50px -12px rgba(0,0,0,.25)"; },
            onMouseLeave: e => { e.currentTarget.style.transform = "translateY(0)"; e.currentTarget.style.boxShadow = "0 12px 40px -12px rgba(0,0,0,.15)"; }
          }, [
            h("div", { style:{ display:"flex", alignItems:"center", gap:14 } }, [
              h("div", { style:{ width:56, height:56, borderRadius:16, background: card.bg, color:"#fff", display:"flex", alignItems:"center", justifyContent:"center", fontSize:28, flexShrink:0 } }, card.icon),
              h("div", { style:{ flex:1, minWidth:0 } }, [
                h("div", { style:{ fontSize:20, fontWeight:900, color:"#0f172a", letterSpacing:"-0.02em" } }, card.title),
                h("div", { style:{ fontSize:12, fontWeight:700, color:"#64748b", marginTop:2, letterSpacing:"0.03em" } }, card.subtitle)
              ])
            ]),
            h("div", { style:{ fontSize:13, color:"#475569", fontWeight:500, lineHeight:1.55 } }, card.desc),
            h("div", { style:{ fontSize:11, fontWeight:800, padding:"6px 12px", borderRadius:999, background: card.bg + "18", color: card.bg, alignSelf: "flex-start", letterSpacing:"0.03em" } }, card.tag)
          ])
        )
      ),
      h("div", { style:{ marginTop:36, textAlign:"center", fontSize:11, color:"#94a3b8", fontWeight:600, letterSpacing:"0.05em" } },
        "LP2SSC · Dashboard Rekap · Read-Only")
    ])
  ]);
}

/* =====================================================================
   ============ MAIN APP ==============================================
   ===================================================================== */
function App() {
  const [mode, setMode] = useState("select");

  if (mode === "select") return h(LandingScreen, { onSelect: setMode });
  if (mode === "template") return h(TemplateDashboard, { onExit: () => setMode("select") });
  if (mode === "subuh") return h(SubuhDashboard, { onExit: () => setMode("select") });

  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
